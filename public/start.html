<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Start Match | parsa.ps</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.7;transform:scale(1.05)}}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fireGlow{0%,100%{text-shadow:0 0 10px #ff6400,0 0 20px #ff9800}50%{text-shadow:0 0 20px #ff6400,0 0 40px #ff9800}}
body{font-family:Arial,sans-serif;color:#eee;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(-45deg,#1a0000,#4a0e0e,#6b1010,#2a0505);background-size:400% 400%;animation:gradientShift 15s ease infinite}
.app{max-width:800px;width:100%;background:rgba(20,5,5,0.6);border:1px solid #6b1010;border-radius:18px;padding:26px;backdrop-filter:blur(10px)}
h1{text-align:center;color:#ff9800;font-size:1.5rem;margin-bottom:6px;animation:fireGlow 3s ease-in-out infinite}
.sub{text-align:center;color:#c98a7a;font-size:0.85rem;margin-bottom:20px}
.card{background:rgba(255,100,0,0.05);border:1px solid #6b1010;border-radius:10px;padding:16px;margin-bottom:14px;transition:all 0.3s}
.card:hover{border-color:#ff6400;box-shadow:0 10px 30px rgba(255,100,0,0.2)}
.card h3{color:#ff9800;font-size:1rem;margin-bottom:12px;border-bottom:1px solid #6b1010;padding-bottom:6px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #6b1010;background:#2a0808;color:#eee;font-family:inherit;text-align:center;letter-spacing:2px;margin-bottom:10px}
input:focus{outline:none;border-color:#ff6400;box-shadow:0 0 0 3px rgba(255,100,0,0.2)}
.btn{width:100%;padding:14px;border-radius:8px;border:none;background:linear-gradient(135deg,#ff6400,#ff9800);color:#fff;font-weight:bold;cursor:pointer;font-family:inherit;margin-top:6px;transition:0.2s;box-shadow:0 4px 15px rgba(255,100,0,0.3)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,100,0,0.6)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn.success{background:linear-gradient(135deg,#4caf50,#2e7d32)}
.btn.danger{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.btn.warning{background:linear-gradient(135deg,#ff9800,#e68900)}
.btn.gold{background:linear-gradient(135deg,#ffd700,#ff9800);color:#222}
.msg{margin-top:12px;text-align:center;font-size:0.9rem;padding:10px;border-radius:8px;display:none}
.msg.show{display:block}
.msg.ok{background:rgba(76,175,80,0.15);color:#4caf50;border:1px solid #4caf50}
.msg.err{background:rgba(231,76,60,0.15);color:#e74c3c;border:1px solid #e74c3c}
.status-box{background:rgba(255,100,0,0.1);border:1px solid #ff6400;border-radius:10px;padding:14px;text-align:center;margin:12px 0}
.status-text{font-size:1.1rem;font-weight:bold;color:#ff9800}
.status-text.open{color:#ffb300}
.status-text.running{color:#4caf50}
.status-text.finished{color:#c98a7a}
.tournament-name{color:#c98a7a;font-size:0.85rem;margin-top:6px}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #6b1010;font-size:0.9rem}
th{color:#ff9800;background:rgba(255,100,0,0.08)}
.btn-mini{padding:6px 10px;border-radius:6px;border:none;background:linear-gradient(135deg,#ff6400,#ff9800);color:#fff;font-weight:bold;cursor:pointer;font-size:0.75rem;font-family:inherit;margin:2px}
.btn-mini:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(255,100,0,0.5)}
.btn-mini.gold{background:linear-gradient(135deg,#ffd700,#ff9800);color:#222}
.btn-mini.silver{background:linear-gradient(135deg,#c0c0c0,#888);color:#222}
.btn-mini.bronze{background:linear-gradient(135deg,#cd7f32,#8b4513);color:#fff}
.winner-row-gold{background:rgba(255,215,0,0.15)!important}
.winner-row-silver{background:rgba(192,192,192,0.1)!important}
.winner-row-bronze{background:rgba(205,127,50,0.1)!important}
.winner-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.7rem;font-weight:bold;margin-right:6px}
.winner-badge.gold{background:#ffd700;color:#222}
.winner-badge.silver{background:#c0c0c0;color:#222}
.winner-badge.bronze{background:#cd7f32;color:#fff}
.winners-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.winner-slot{background:rgba(0,0,0,0.3);border:2px dashed #6b1010;border-radius:10px;padding:14px;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.winner-slot.filled{border-style:solid}
.winner-slot.gold{border-color:#ffd700;background:rgba(255,215,0,0.1)}
.winner-slot.silver{border-color:#c0c0c0;background:rgba(192,192,192,0.08)}
.winner-slot.bronze{border-color:#cd7f32;background:rgba(205,127,50,0.08)}
.winner-slot .medal{font-size:2rem;margin-bottom:6px}
.winner-slot .name{color:#fff;font-weight:bold;font-size:0.95rem}
.winner-slot .score{color:#c98a7a;font-size:0.8rem;margin-top:4px}
.winner-slot .empty-text{color:#8a5a4a;font-size:0.85rem;font-style:italic}
.footer{text-align:center;margin-top:16px;font-size:0.8rem;color:#8a5a4a}
.footer a{color:#ff9800;text-decoration:none;margin:0 8px}
.copyright{text-align:center;margin-top:14px;font-size:0.75rem;color:#8a5a4a;letter-spacing:1px}
.loading-spinner{display:inline-block;width:40px;height:40px;border:4px solid rgba(255,100,0,0.2);border-top-color:#ff6400;border-radius:50%;animation:spin 1s linear infinite}
#page-loader{position:fixed;top:0;left:0;width:100vw;height:100vh;background:linear-gradient(135deg,#1a0000,#4a0e0e,#6b1010);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s,visibility 0.5s}
#page-loader.hidden-loader{opacity:0;visibility:hidden}
#page-loader .logo{font-size:4rem;margin-bottom:20px;animation:float 2s ease-in-out infinite;filter:drop-shadow(0 0 20px #ff6400)}
#page-loader .title{color:#ff9800;font-size:1.5rem;font-weight:bold;margin-bottom:30px;animation:fireGlow 2s ease-in-out infinite}
#page-loader .spinner-box{display:flex;gap:8px}
#page-loader .dot{width:12px;height:12px;border-radius:50%;background:#ff6400;animation:pulse 1.4s ease-in-out infinite;box-shadow:0 0 15px #ff6400}
#page-loader .dot:nth-child(2){animation-delay:0.2s;background:#ff9800}
#page-loader .dot:nth-child(3){animation-delay:0.4s;background:#ffb300}
#page-loader .text-bottom{color:#c98a7a;font-size:0.85rem;margin-top:30px;letter-spacing:2px}
</style>
</head>
<body>

<div id="page-loader">
  <div class="logo">🎮</div>
  <div class="title">Start Match</div>
  <div class="spinner-box"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="text-bottom">parsa.ps</div>
</div>

<div class="app">

<h1>🎮 Start Match</h1>
<p class="sub">Minecraft Annual Awards</p>

<div id="login-view" class="card">
<h3>🔐 Login with Password</h3>
<input type="password" id="pass" placeholder="Enter password" autocomplete="off">
<button class="btn" onclick="doLogin()">Login</button>
<div id="login-msg" class="msg"></div>
</div>

<div id="panel-view" class="hidden">

<div class="card">
<h3>🏆 Match Status</h3>
<div class="status-box">
<div class="status-text" id="status-text">-</div>
<div class="tournament-name" id="tournament-name"></div>
</div>
<button class="btn" onclick="loadStatus()">🔄 Refresh</button>
</div>

<div class="card">
<h3>🎯 Match Control</h3>
<button class="btn success" onclick="startTournament()">▶️ Start Match</button>
<button class="btn danger" onclick="stopTournament()">⏹️ Stop Match</button>
<button class="btn warning" onclick="resetTournament()">🔄 Reset Match</button>
<div id="ctrl-msg" class="msg"></div>
</div>

<div class="card">
<h3>🏅 Current Winners (Top 3)</h3>
<div class="winners-grid">
  <div class="winner-slot" id="slot-1">
    <div class="medal">🥇</div>
    <div class="empty-text">Not selected</div>
  </div>
  <div class="winner-slot" id="slot-2">
    <div class="medal">🥈</div>
    <div class="empty-text">Not selected</div>
  </div>
  <div class="winner-slot" id="slot-3">
    <div class="medal">🥉</div>
    <div class="empty-text">Not selected</div>
  </div>
</div>
<div id="winners-msg" class="msg"></div>
</div>

<div class="card">
<h3>📋 Participants (Select winners)</h3>
<button class="btn" onclick="loadLeaderboard()">🔄 Refresh</button>
<div id="leaderboard-list"></div>
</div>

<div class="footer">
<a href="/index.html">🏠 Home</a>
<a href="/admin.html">🔐 Admin Panel</a>
<a href="/quiz.html">🎮 Quiz Page</a>
</div>

<div class="copyright">© parsa.ps</div>

</div>

</div>

<script>
const API = window.location.origin + '/api';
const SECRET_PASSWORD = 'minecraft2026';
const YEAR = new Date().getFullYear();

function doLogin() {
  const pass = document.getElementById('pass').value.trim();
  const msg = document.getElementById('login-msg');
  msg.className = 'msg';
  if (pass === SECRET_PASSWORD) {
    sessionStorage.setItem('start_panel_auth', '1');
    showPanel();
  } else {
    msg.textContent = '❌ Wrong password';
    msg.className = 'msg show err';
  }
}

function showPanel() {
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('panel-view').classList.remove('hidden');
  loadStatus();
  loadLeaderboard();
}

async function getAdminToken() {
  const res = await fetch(API + '/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: 'admin1', password: 'admin123'})
  });
  const json = await res.json();
  if (!json.ok) throw new Error('Admin login failed');
  return json.token;
}

async function loadStatus() {
  const st = document.getElementById('status-text');
  const nt = document.getElementById('tournament-name');
  try {
    const res = await fetch(API + '/tournaments');
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    const t = json.tournaments.find(x => x.year === YEAR);
    if (!t) { st.textContent = '⚠️ No match found'; st.className = 'status-text'; nt.textContent = ''; return; }
    nt.textContent = t.name + ' — Year ' + t.year;
    if (t.status === 'open') { st.textContent = '🟢 Registration Open'; st.className = 'status-text open'; }
    else if (t.status === 'running') { st.textContent = '🔴 Live'; st.className = 'status-text running'; }
    else { st.textContent = '✅ Finished'; st.className = 'status-text finished'; }
  } catch(e) { st.textContent = '❌ ' + e.message; st.className = 'status-text'; }
}

async function startTournament() {
  if (!confirm('Start the match?')) return;
  const msg = document.getElementById('ctrl-msg');
  msg.textContent = '⏳ ...'; msg.className = 'msg show';
  try {
    const token = await getAdminToken();
    const res = await fetch(API + '/admin/start-tournament/' + YEAR, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token}
    });
    const json = await res.json();
    msg.textContent = json.ok ? json.message : '❌ ' + json.error;
    msg.className = 'msg show ' + (json.ok ? 'ok' : 'err');
    if (json.ok) { loadStatus(); loadLeaderboard(); }
  } catch(e) { msg.textContent = '❌ ' + e.message; msg.className = 'msg show err'; }
}

async function stopTournament() {
  if (!confirm('Stop the match?')) return;
  const msg = document.getElementById('ctrl-msg');
  msg.textContent = '⏳ ...'; msg.className = 'msg show';
  try {
    const token = await getAdminToken();
    const res = await fetch(API + '/admin/stop-tournament/' + YEAR, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token}
    });
    const json = await res.json();
    msg.textContent = json.ok ? json.message : '❌ ' + json.error;
    msg.className = 'msg show ' + (json.ok ? 'ok' : 'err');
    if (json.ok) { loadStatus(); loadLeaderboard(); }
  } catch(e) { msg.textContent = '❌ ' + e.message; msg.className = 'msg show err'; }
}

async function resetTournament() {
  if (!confirm('Reset the match? All quiz results will be deleted!')) return;
  const msg = document.getElementById('ctrl-msg');
  msg.textContent = '⏳ ...'; msg.className = 'msg show';
  try {
    const token = await getAdminToken();
    const res = await fetch(API + '/admin/reset-tournament/' + YEAR, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token}
    });
    const json = await res.json();
    msg.textContent = json.ok ? json.message : '❌ ' + json.error;
    msg.className = 'msg show ' + (json.ok ? 'ok' : 'err');
    if (json.ok) { loadStatus(); loadLeaderboard(); loadCurrentWinners(); }
  } catch(e) { msg.textContent = '❌ ' + e.message; msg.className = 'msg show err'; }
}

async function loadCurrentWinners() {
  try {
    const res = await fetch(API + '/winners/' + YEAR);
    const json = await res.json();
    const slots = {1: document.getElementById('slot-1'), 2: document.getElementById('slot-2'), 3: document.getElementById('slot-3')};

    // reset slots
    [1, 2, 3].forEach(r => {
      const slot = slots[r];
      slot.className = 'winner-slot';
      const medal = r === 1 ? '🥇' : r === 2 ? '🥈' : '🥉';
      slot.innerHTML = '<div class="medal">' + medal + '</div><div class="empty-text">Not selected</div>';
    });

    if (json.ok && json.winners) {
      json.winners.forEach(w => {
        const slot = slots[w.rank];
        if (!slot) return;
        const colorClass = w.rank === 1 ? 'gold' : w.rank === 2 ? 'silver' : 'bronze';
        const medal = w.rank === 1 ? '🥇' : w.rank === 2 ? '🥈' : '🥉';
        slot.className = 'winner-slot filled ' + colorClass;
        slot.innerHTML = '<div class="medal">' + medal + '</div>' +
          '<div class="name">' + w.player_name + '</div>' +
          '<div class="score">' + (w.score || 0) + ' pts</div>';
      });
    }
  } catch(e) { console.error(e); }
}

async function loadLeaderboard() {
  const box = document.getElementById('leaderboard-list');
  box.innerHTML = '<p style="color:#c98a7a;text-align:center;padding:10px">⏳ Loading...</p>';
  try {
    const res = await fetch(API + '/quiz/leaderboard/' + YEAR);
    const json = await res.json();
    if (!json.ok || !json.leaderboard || !json.leaderboard.length) {
      box.innerHTML = '<p style="color:#8a5a4a;text-align:center;padding:10px">No participants yet</p>';
      loadCurrentWinners();
      return;
    }

    // Get current winners
    let winnerMap = {};
    try {
      const wRes = await fetch(API + '/winners/' + YEAR);
      const wJson = await wRes.json();
      if (wJson.ok && wJson.winners) {
        wJson.winners.forEach(w => { winnerMap[w.player_name] = w.rank; });
      }
    } catch(e) {}

    let html = '<table><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Time</th><th>Select as</th></tr></thead><tbody>';
    json.leaderboard.forEach((w, i) => {
      const rank = i + 1;
      const existingRank = winnerMap[w.player_name];
      let rowClass = '';
      let badge = '';

      if (existingRank === 1) { rowClass = 'winner-row-gold'; badge = '<span class="winner-badge gold">🥇 1st</span>'; }
      else if (existingRank === 2) { rowClass = 'winner-row-silver'; badge = '<span class="winner-badge silver">🥈 2nd</span>'; }
      else if (existingRank === 3) { rowClass = 'winner-row-bronze'; badge = '<span class="winner-badge bronze">🥉 3rd</span>'; }

      html += '<tr class="' + rowClass + '">' +
        '<td>' + rank + '</td>' +
        '<td>' + badge + w.player_name + '</td>' +
        '<td><b style="color:#ff9800">' + w.score + '/' + w.total_questions + '</b></td>' +
        '<td>' + w.duration_seconds + 's</td>' +
        '<td>' +
          '<button class="btn-mini gold" onclick="selectWinner(' + w.id + ', 1, \'' + escapeHtml(w.player_name) + '\')">🥇</button>' +
          '<button class="btn-mini silver" onclick="selectWinner(' + w.id + ', 2, \'' + escapeHtml(w.player_name) + '\')">🥈</button>' +
          '<button class="btn-mini bronze" onclick="selectWinner(' + w.id + ', 3, \'' + escapeHtml(w.player_name) + '\')">🥉</button>' +
        '</td>' +
      '</tr>';
    });
    html += '</tbody></table>';
    box.innerHTML = html;
    loadCurrentWinners();
  } catch(e) { box.innerHTML = '<p style="color:#e74c3c;text-align:center;padding:10px">❌ ' + e.message + '</p>'; }
}

function escapeHtml(str) {
  return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

async function selectWinner(attemptId, rank, playerName) {
  const rankNames = {1: '🥇 First Place', 2: '🥈 Second Place', 3: '🥉 Third Place'};
  if (!confirm('Select "' + playerName + '" as ' + rankNames[rank] + '?')) return;

  const msg = document.getElementById('winners-msg');
  msg.textContent = '⏳ ...'; msg.className = 'msg show';

  try {
    const token = await getAdminToken();
    const res = await fetch(API + '/admin/select-winner/' + YEAR, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
      body: JSON.stringify({attemptId: attemptId, rank: rank})
    });
    const json = await res.json();
    msg.textContent = json.ok ? json.message : '❌ ' + json.error;
    msg.className = 'msg show ' + (json.ok ? 'ok' : 'err');
    if (json.ok) { loadLeaderboard(); loadCurrentWinners(); }
  } catch(e) { msg.textContent = '❌ ' + e.message; msg.className = 'msg show err'; }
}

window.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('start_panel_auth') === '1') showPanel();
  document.getElementById('pass').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
});

window.addEventListener('load', () => {
  setTimeout(() => {
    const loader = document.getElementById('page-loader');
    if (loader) { loader.classList.add('hidden-loader'); setTimeout(() => loader.remove(), 600); }
  }, 1000);
});
</script>
</body>
</html>
