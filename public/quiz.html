<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiz Match | parsa.ps</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.7;transform:scale(1.05)}}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fireGlow{0%,100%{text-shadow:0 0 10px #ff6400,0 0 20px #ff9800}50%{text-shadow:0 0 20px #ff6400,0 0 40px #ff9800}}
body{font-family:Arial,sans-serif;color:#eee;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(-45deg,#1a0000,#4a0e0e,#6b1010,#2a0505);background-size:400% 400%;animation:gradientShift 15s ease infinite}
.app{max-width:640px;width:100%;background:rgba(20,5,5,0.6);border:1px solid #6b1010;border-radius:18px;padding:26px;backdrop-filter:blur(10px)}
h1{text-align:center;color:#ff9800;font-size:1.5rem;margin-bottom:6px;animation:fireGlow 3s ease-in-out infinite}
.sub{text-align:center;color:#c98a7a;font-size:0.85rem;margin-bottom:20px}
.btn{width:100%;padding:12px;border-radius:8px;border:none;background:linear-gradient(135deg,#ff6400,#ff9800);color:#fff;font-weight:bold;cursor:pointer;font-family:inherit;margin-top:6px;transition:0.2s;box-shadow:0 4px 15px rgba(255,100,0,0.3)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,100,0,0.6)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn.success{background:linear-gradient(135deg,#4caf50,#2e7d32)}
.btn.danger{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.btn.warning{background:linear-gradient(135deg,#ff9800,#e68900)}
.center{text-align:center;padding:40px 20px}
.loading{color:#c98a7a;text-align:center;padding:30px}
.empty{color:#8a5a4a;font-style:italic;text-align:center;padding:20px}
.quiz-header{display:flex;justify-content:space-between;margin-bottom:12px;font-size:0.9rem}
.quiz-num{color:#ff9800;font-weight:bold}
.quiz-bar{background:#2a0808;height:8px;border-radius:4px;overflow:hidden;margin-bottom:20px}
.quiz-bar-fill{background:linear-gradient(90deg,#ff6400,#ff9800);height:100%;width:0%;transition:0.4s}
.quiz-q{color:#fff;font-size:1.05rem;font-weight:bold;margin-bottom:18px;line-height:1.7;padding:16px;background:rgba(255,100,0,0.08);border-radius:10px;border-left:3px solid #ff6400;text-align:left}
.quiz-option{width:100%;padding:14px;border-radius:10px;border:1px solid #6b1010;background:#2a0808;color:#eee;text-align:left;cursor:pointer;font-family:inherit;font-size:0.95rem;margin-bottom:10px;transition:0.2s;display:flex;align-items:center;gap:10px}
.quiz-option:hover:not(:disabled){border-color:#ff6400;background:rgba(255,100,0,0.15);transform:translateX(4px)}
.quiz-option:disabled{cursor:not-allowed}
.quiz-option .key{color:#ff9800;font-weight:bold;font-size:1.1rem;min-width:24px}
.quiz-option.correct{border-color:#4caf50;background:rgba(76,175,80,0.2)}
.quiz-option.wrong{border-color:#e74c3c;background:rgba(231,76,60,0.2)}
.quiz-feedback{text-align:center;padding:14px;font-weight:bold;border-radius:10px;margin:14px 0}
.quiz-feedback.correct{color:#4caf50;background:rgba(76,175,80,0.15);border:1px solid #4caf50}
.quiz-feedback.wrong{color:#e74c3c;background:rgba(231,76,60,0.15);border:1px solid #e74c3c}
.audio-controls{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.audio-controls button{width:auto;padding:8px 14px;font-size:0.85rem;margin:0}
.result{text-align:center;padding:20px}
.result .medal{font-size:4rem;margin-bottom:14px;filter:drop-shadow(0 0 20px #ff6400)}
.result .score{color:#ff9800;font-size:2.5rem;font-weight:bold;margin:14px 0 8px}
.result .percent{color:#c98a7a;font-size:1.1rem;margin-bottom:16px}
.result .info{color:#c98a7a;font-size:0.9rem;margin-bottom:20px}
.player-info{display:flex;justify-content:space-between;margin-bottom:16px;padding:12px;background:rgba(0,0,0,0.3);border-radius:10px;border:1px solid #6b1010;font-size:0.85rem}
.player-info .name{color:#ff9800;font-weight:bold}
.player-info .tournament{color:#c98a7a}
.copyright{text-align:center;margin-top:14px;font-size:0.75rem;color:#8a5a4a;letter-spacing:1px}
.loading-spinner{display:inline-block;width:40px;height:40px;border:4px solid rgba(255,100,0,0.2);border-top-color:#ff6400;border-radius:50%;animation:spin 1s linear infinite}
#page-loader{position:fixed;top:0;left:0;width:100vw;height:100vh;background:linear-gradient(135deg,#1a0000,#4a0e0e,#6b1010);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s,visibility 0.5s}
#page-loader.hidden-loader{opacity:0;visibility:hidden}
#page-loader .logo{font-size:4rem;margin-bottom:20px;animation:float 2s ease-in-out infinite;filter:drop-shadow(0 0 20px #ff6400)}
#page-loader .title{color:#ff9800;font-size:1.5rem;font-weight:bold;margin-bottom:30px;animation:fireGlow 2s ease-in-out infinite}
#page-loader .spinner-box{display:flex;gap:8px}
#page-loader .dot{width:12px;height:12px;border-radius:50%;background:#ff6400;animation:pulse 1.4s ease-in-out infinite;box-shadow:0 0 15px #ff6400}
#page-loader .dot:nth-child(2){animation-delay:0.2s;background:#ff9800}
#page-loader .dot:nth-child(3){animation-delay:0.4s;background:#ffb300}
#page-loader .text-bottom{color:#c98a7a;font-size:0.85rem;margin-top:30px;letter-spacing:2px}
</style>
</head>
<body>

<div id="page-loader">
  <div class="logo">🎯</div>
  <div class="title">Quiz Match</div>
  <div class="spinner-box"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="text-bottom">parsa.ps</div>
</div>

<div class="app">
<h1>🎯 Minecraft Quiz Match</h1>
<p class="sub">Minecraft Annual Awards</p>
<div id="content"><div class="loading">Loading...</div></div>
<div class="copyright">© parsa.ps</div>
</div>

<script>
const API = window.location.origin + '/api';
const token = localStorage.getItem('player_token');
let currentQuiz = null;
let currentQuestionIndex = 0;

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  u.pitch = 1;
  u.volume = 1;
  window.speechSynthesis.speak(u);
}

function stopSpeaking() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

async function init() {
  const box = document.getElementById('content');
  if (!token) {
    box.innerHTML = '<div class="center"><p style="color:#e74c3c;margin-bottom:16px">❌ Please login first</p><button class="btn" onclick="location.href=\'/index.html\'">🔓 Login</button></div>';
    return;
  }
  try {
    const tRes = await fetch(API + '/tournament/active');
    const tJson = await tRes.json();
    if (!tJson.ok) { box.innerHTML = '<div class="empty">⚠️ No active match</div>'; return; }
    const t = tJson.tournament;
    const hRes = await fetch(API + '/quiz/my-history', { headers: {'Authorization': 'Bearer ' + token} });
    const hJson = await hRes.json();
    if (hJson.ok && hJson.hasAttempt) {
      const a = hJson.attempt;
      const pct = Math.round((a.score / a.total_questions) * 100);
      box.innerHTML = '<div class="result"><div class="medal">🎖</div><p style="color:#4caf50">✅ You already participated</p><div class="score">' + a.score + ' / ' + a.total_questions + '</div><div class="percent">' + pct + '%</div><div class="info">⏱ Time: ' + a.duration_seconds + 's</div><button class="btn" onclick="location.href=\'/index.html\'">👤 Back</button></div>';
      return;
    }
    if (t.status === 'open') {
      box.innerHTML = '<div class="center"><p style="color:#c98a7a;margin-bottom:16px">⏳ Match not started yet</p><button class="btn" onclick="location.href=\'/index.html\'">👤 Back</button></div>';
      return;
    }
    if (t.status === 'finished') {
      box.innerHTML = '<div class="center"><p style="color:#c98a7a">✅ Match finished</p><button class="btn" onclick="location.href=\'/index.html\'">👤 Back</button></div>';
      return;
    }
    box.innerHTML = '<div class="player-info"><span class="name">👤 ' + (localStorage.getItem('player_name') || 'Player') + '</span><span class="tournament">🏆 ' + t.name + '</span></div><div class="center"><p style="color:#4caf50;margin-bottom:14px">🟢 Match is live!</p><p style="color:#e0a090;margin-bottom:8px">10 Minecraft questions</p><p style="color:#ff9800;font-size:0.9rem;margin-bottom:20px">🔊 Questions and options read aloud</p><button class="btn success" onclick="startQuiz()">🎮 Start Quiz</button></div>';
  } catch(e) { box.innerHTML = '<div class="empty">❌ Error: ' + e.message + '</div>'; }
}

async function startQuiz() {
  const box = document.getElementById('content');
  box.innerHTML = '<div class="center"><div class="loading-spinner"></div><p style="color:#ff9800;margin-top:16px">⏳ Preparing...</p></div>';
  try {
    const res = await fetch(API + '/quiz/start', { method: 'POST', headers: {'Authorization': 'Bearer ' + token} });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    currentQuiz = {attemptId: json.attemptId, questions: json.questions};
    currentQuestionIndex = 0;
    renderQuestion();
  } catch(e) { box.innerHTML = '<div class="center"><p style="color:#e74c3c">❌ ' + e.message + '</p><button class="btn" onclick="location.href=\'/index.html\'">Back</button></div>'; }
}

function renderQuestion() {
  const box = document.getElementById('content');
  const q = currentQuiz.questions[currentQuestionIndex];
  const total = currentQuiz.questions.length;
  const num = currentQuestionIndex + 1;
  const progress = Math.round((num / total) * 100);
  const options = [{key:'a',text:q.a},{key:'b',text:q.b},{key:'c',text:q.c},{key:'d',text:q.d}];
  let html = '<div class="player-info"><span class="name">👤 ' + (localStorage.getItem('player_name') || 'Player') + '</span><span class="tournament">🏆 ' + num + ' / ' + total + '</span></div>';
  html += '<div class="quiz-header"><span class="quiz-num">Question ' + num + ' / ' + total + '</span><span style="color:#c98a7a">' + progress + '%</span></div>';
  html += '<div class="quiz-bar"><div class="quiz-bar-fill" style="width:' + progress + '%"></div></div>';
  html += '<div class="quiz-q">' + q.question + '</div>';
  html += '<div class="audio-controls"><button class="btn warning" onclick="readQuestion()">🔊 Read Question</button><button class="btn danger" onclick="stopSpeaking()">🔇 Stop</button></div>';
  options.forEach(opt => {
    html += '<button class="quiz-option" id="opt-' + opt.key + '" onclick="answerQuestion(\'' + opt.key + '\')"><span class="key">' + opt.key.toUpperCase() + '.</span><span>' + opt.text + '</span></button>';
  });
  box.innerHTML = html;
  setTimeout(() => readQuestion(), 400);
}

function readQuestion() {
  const q = currentQuiz.questions[currentQuestionIndex];
  if (!q) return;
  const text = 'Question ' + (currentQuestionIndex + 1) + '. ' + q.question + '. Option A. ' + q.a + '. Option B. ' + q.b + '. Option C. ' + q.c + '. Option D. ' + q.d + '. Now choose the correct answer.';
  speak(text);
}

async function answerQuestion(selected) {
  stopSpeaking();
  document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
  const q = currentQuiz.questions[currentQuestionIndex];
  try {
    const res = await fetch(API + '/quiz/answer', { method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token}, body: JSON.stringify({attemptId: currentQuiz.attemptId, questionId: q.id, selectedAnswer: selected}) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    const sBtn = document.getElementById('opt-' + selected);
    const cBtn = document.getElementById('opt-' + json.correctAnswer);
    if (json.isCorrect) sBtn.classList.add('correct');
    else { sBtn.classList.add('wrong'); cBtn.classList.add('correct'); }
    const fb = document.createElement('div');
    fb.className = 'quiz-feedback ' + (json.isCorrect ? 'correct' : 'wrong');
    fb.textContent = json.isCorrect ? '✅ Correct!' : '❌ Wrong — Answer: ' + json.correctAnswer.toUpperCase();
    document.getElementById('content').appendChild(fb);
    if (json.isCorrect) speak('Great! Correct.');
    else speak('Sorry, wrong. The correct answer is option ' + json.correctAnswer.toUpperCase() + '.');
    setTimeout(() => {
      currentQuestionIndex++;
      if (currentQuestionIndex < currentQuiz.questions.length) renderQuestion();
      else finishQuiz();
    }, 2200);
  } catch(e) { alert('❌ ' + e.message); }
}

async function finishQuiz() {
  stopSpeaking();
  const box = document.getElementById('content');
  box.innerHTML = '<div class="center"><div class="loading-spinner"></div><p style="color:#ff9800;margin-top:16px">⏳ Calculating...</p></div>';
  try {
    const res = await fetch(API + '/quiz/finish', { method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token}, body: JSON.stringify({attemptId: currentQuiz.attemptId}) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    const a = json.attempt;
    const pct = Math.round((a.score / a.total_questions) * 100);
    let medal = '🎖';
    if (pct >= 90) medal = '🥇';
    else if (pct >= 70) medal = '🥈';
    else if (pct >= 50) medal = '🥉';
    let msg = pct >= 90 ? '🔥 Amazing!' : pct >= 70 ? '👏 Very good!' : pct >= 50 ? '💪 Good effort' : '😅 Need more practice';
    box.innerHTML = '<div class="result"><div class="medal">' + medal + '</div><div class="score">' + a.score + ' / ' + a.total_questions + '</div><div class="percent">' + pct + '% - ' + msg + '</div><div class="info">⏱ Time: ' + a.duration_seconds + 's</div><div style="margin-top:20px;padding:16px;background:rgba(255,100,0,0.1);border:1px solid #ff6400;border-radius:12px"><p style="color:#ff9800;margin-bottom:6px">🏆 Final results will be announced at the end</p><small style="color:#c98a7a">The winner gets a Minecraft cape! 🧥</small></div><button class="btn" style="margin-top:20px" onclick="location.href=\'/index.html\'">👤 Back to Profile</button></div>';
    setTimeout(() => speak('Your score is ' + a.score + ' out of ' + a.total_questions + '. ' + msg), 500);
  } catch(e) { box.innerHTML = '<div class="empty">❌ ' + e.message + '</div>'; }
}

init();

window.addEventListener('load', () => {
  setTimeout(() => {
    const loader = document.getElementById('page-loader');
    if (loader) { loader.classList.add('hidden-loader'); setTimeout(() => loader.remove(), 600); }
  }, 1000);
});
</script>
</body>
</html>
